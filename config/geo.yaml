  SA: {name: Arabie saoudite, region: middle_east, aliases: [Saudi Arabia, Saudi, Arabie saoudite, saoudien, saoudienne]}
  IL: {name: Israël, region: middle_east, aliases: [Israel, Israeli, Israël, israélien, israélienne]}
