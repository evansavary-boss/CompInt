      programme spatial de l'UE (Galileo, Copernicus, IRIS²) et Fonds européen de la défense.
    highlights: [Galileo, Copernicus, IRIS², EU Space Act]
    news_query: '"European Commission" space OR satellite OR "DG DEFIS" OR "EU Space Act"'
    news_editions: [en, fr]

  - id: euspa
