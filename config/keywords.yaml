# Mots-clés de filtrage et de tagging.
#
# Règles de correspondance :
#   - include / exclude : insensibles à la casse et aux accents, sur mots entiers
#     (un pluriel simple en s/x/es est accepté : "lanceur" trouve "lanceurs").
#   - acronyms : sensibles à la casse (ex. "SAR" ne trouve pas "sar").
#   - Un item reçoit le tag d'un domaine si au moins un mot-clé include ou acronym
#     de ce domaine est présent ET aucun mot-clé exclude de ce domaine.
#   - global_exclude : l'item est écarté quel que soit le domaine.

