# Institutions suivies. Identifiants Wikidata vérifiés le 2026-10-23.
#
# Champs :
#   id, name, wikidata, aliases, aliases_cs, description, highlights, news_query : comme companies.yaml
#   full_name    nom développé
#   type         clé de la section `types` ci-dessous
#   countries    codes pays ISO ; vide pour une organisation multinationale
#   region       région de rattachement pour une organisation multinationale (voir config/geo.yaml)
#   domains      geospatial | newspace
#   facts        (optionnel) corrige un fait Wikidata périmé (voir companies.yaml)

types:
  agence_spatiale: Agence spatiale
  agence_civile: Agence civile
  defense: Défense
  renseignement: Renseignement
  ue: Union européenne
  international: Organisation internationale
  regulateur: Régulateur

institutions:
  # ------------------------------------------------------------ France
  - id: cnes
    name: CNES
    full_name: Centre national d'études spatiales
    wikidata: Q48756
    type: agence_spatiale
    countries: [FR]
    domains: [newspace, geospatial]
    aliases: [Centre national d'études spatiales, French space agency]
    aliases_cs: [CNES]
    description: >-
      Agence spatiale française : conçoit et finance les programmes spatiaux civils et duaux, et
      représente la France à l'ESA.
    highlights: [SWOT, CO3D]

  - id: commandement-espace
    name: Commandement de l'Espace
    full_name: Commandement de l'Espace (armée de l'Air et de l'Espace)
    wikidata: Q67185799
    type: defense
    countries: [FR]
    domains: [newspace, geospatial]
    aliases: [Commandement de l'espace, French Space Command]
    description: >-
      Commandement de l'armée de l'Air et de l'Espace chargé des opérations spatiales militaires
      françaises, créé en 2019 et basé à Toulouse.
    highlights: [AsterX, Syracuse IV, CSO]
    news_query: '"Commandement de l''espace" OR "French Space Command"'

  - id: dga
    name: DGA
    full_name: Direction générale de l'armement
    wikidata: Q3029559
    type: defense
    countries: [FR]
    domains: [newspace, geospatial]
    aliases: [Direction générale de l'armement]
    aliases_cs: [DGA]
    description: >-
      Agence d'acquisition du ministère des Armées : conduit les programmes d'armement, dont les
      satellites militaires (CSO, Syracuse, CERES).
    highlights: [CSO, Syracuse IV, CERES]
    facts: {director: Emmanuel Chiva}   # Wikidata indique encore Joël Barre
    news_query: '"DGA" spatial OR satellite OR espace'

  - id: ministere-armees
    name: Ministère des Armées
    full_name: Ministère des Armées
    wikidata: Q75706
    type: defense
    countries: [FR]
    domains: [newspace, geospatial]
    aliases: [ministère des Armées, ministre des Armées, French Ministry of the Armed Forces,
              French Ministry of Armed Forces, French armed forces minister]
    description: >-
      Ministère français de la Défense : porte la loi de programmation militaire et la stratégie
      spatiale de défense.
    highlights: [Loi de programmation militaire]
    facts: {director: Catherine Vautrin}   # Wikidata indique encore Sébastien Lecornu
    news_query: '"ministère des Armées" spatial OR satellite OR espace'

  # ------------------------------------------------------------ Europe
  - id: esa
    name: ESA
    full_name: Agence spatiale européenne
