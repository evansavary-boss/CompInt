# Pays et régions détectés dans les articles.
#
# Un article est rattaché à un pays si l'un de ses termes apparaît (insensible à la casse et aux
# accents, mots entiers, pluriels simples acceptés), ou s'il cite une entité de ce pays.
#   aliases     noms et gentilés en français et en anglais
#   aliases_cs  sigles sensibles à la casse (US, UK, UAE…)
#   num         code ISO 3166 numérique (relie le pays au fond de carte)
#   a3          code ISO 3166 à trois lettres (pays des acheteurs dans les avis TED)
#   capital     capitale (affichée sur la fiche pays)
# Mettre entre guillemets les codes que YAML lirait comme un booléen ("NO" pour la Norvège).

regions:
  europe: Europe
  north_america: Amérique du Nord
  latin_america: Amérique latine
  asia_pacific: Asie-Pacifique
  middle_east: Moyen-Orient
  africa: Afrique
  russia_eurasia: Russie et Eurasie
  international: International

