      - regulatory
      - licence
      - license
      - licensing
      - spectrum
      - space law
      - EU Space Act
      - legislation
      - réglementation
      - loi spatiale
      - licence d'exploitation
      - fréquences
      - autorisation

  export_sanctions:
    section: politique
    label: Exports et sanctions
    patterns_cs: [ITAR]
    patterns:
      - export control
      - export controls
      - sanctions
      - embargo
      - export licence
      - export license
      - contrôle des exportations
      - contrôle des exports

  appointment:
    section: auto
    label: Nomination
    patterns:
      - appointed
      - appoints
      - named as
      - names new
      - new CEO
      - new chief
      - new director
      - promotes
      - promoted to
      - hires
      - nominee
      - confirmed as
      - steps down
      - resigns
