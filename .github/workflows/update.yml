name: Mise à jour quotidienne

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 08:00 Paris (heure d'été) / 07:00 (heure d'hiver)
  workflow_dispatch:       # bouton "Run workflow" dans l'onglet Actions
    inputs:
      backfill:
        description: "Rattrapage Google News (30 jours) et appels d'offres (TED 180 jours, Find a Tender 14 jours)"
        type: boolean
        default: false
      analyse_max:
        description: "Nombre maximal de sujets analysés par Claude (vide = réglage par défaut)"
        type: string
        default: ""

permissions:
  contents: write          # commit de data/ et docs/

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45    # collecte (~5 min) + analyse des sujets (15 min max) + appels d'offres (~8 min) + marge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Claude Code analyses the stories with the owner's Claude subscription. Without the
      # CLAUDE_CODE_OAUTH_TOKEN secret the build still runs, with rule-based classification only.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Tests
        run: python -m pytest -q

      - name: Backfill Google News and tenders (optional)
        if: ${{ inputs.backfill }}
        run: |
          python -m src.collect --backfill
          python -m src.tenders --backfill --no-analyse

      - name: Refresh entities, collect, classify, fetch tenders, analyse and build
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANALYSE_MAX: ${{ inputs.analyse_max }}
        run: |
          if [ -n "$ANALYSE_MAX" ]; then
            python -m src.build --analyse-max "$ANALYSE_MAX"
          else
            python -m src.build
          fi

      - name: Commit data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Mise à jour du $(TZ=Europe/Paris date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
