# Flux RSS suivis. Tous vérifiés le 2026-10-22 (HTTP 200 + entrées récentes).
#
# Champs :
#   name              nom affiché
#   url               URL du flux RSS/Atom
#   section           politique | entreprises
#   domain            geospatial | newspace : tag par défaut si aucun mot-clé ne correspond
#   require_keywords  true  = source généraliste : un item n'est gardé que s'il contient un mot-clé
#                     false = source spécialisée : tout est gardé, le tag par défaut s'applique
#   lang              fr | en (informatif)
#   exclude_url_patterns  (optionnel) items écartés si leur URL contient l'un de ces fragments

sources:
  # ---------------------------------------------------------------- Politique
