    countries: []
    region: europe
    domains: [newspace, geospatial]
    aliases: [European Space Agency, Agence spatiale européenne]
    aliases_cs: [ESA]
    description: >-
      Agence spatiale intergouvernementale européenne (siège à Paris) : sciences, lanceurs,
      observation de la Terre, navigation et exploration.
    highlights: [Ariane 6, Copernicus (segment spatial), European Launcher Challenge]
    news_query: '"ESA" space OR satellite OR spatial'
    news_editions: [en, fr]

  - id: commission-europeenne
