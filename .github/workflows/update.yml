name: Mise à jour quotidienne

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 08:00 Paris (heure d'été) / 07:00 (heure d'hiver)
  workflow_dispatch:       # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write          # commit de data/ et docs/

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Collect, market and build
        run: python -m src.build

      - name: Commit data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Mise à jour du $(TZ=Europe/Paris date +'%Y-%m-%d %H:%M')"
            git push
          fi
