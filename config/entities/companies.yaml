# Entreprises suivies. Identifiants Wikidata vérifiés le 2026-10-23.
#
# Champs :
#   id           identifiant court (URL de la fiche : entite/<id>.html)
#   name         nom affiché
#   wikidata     identifiant Wikidata (Q…) : siège, création, dirigeant, effectif, site, logo
#   countries    codes pays ISO (voir config/geo.yaml) ; le premier est le pays principal
#   segments     clés de la section `segments` ci-dessous
#   domains      geospatial | newspace
#   aliases      termes détectés dans les articles (insensibles à la casse et aux accents)
#   aliases_cs   termes détectés en respectant la casse (sigles ambigus : SES, RFA…)
#   description  2 lignes rédigées, modifiables
#   highlights   produits, satellites ou lanceurs clés
#   news_query   (optionnel) requête Google News ; par défaut : "<name>"
#   facts        (optionnel) corrige un fait Wikidata périmé, prioritaire sur Wikidata ;
#                null masque le champ. Clés : founded, headquarters, country, ceo, director,
#                parent, employees, website, logo, wikipedia

segments:
  eo_optique: Observation optique
  eo_radar: Observation radar (SAR)
  eo_thermique: Observation thermique et hyperspectrale
  rf_intel: Renseignement radiofréquence
  geoint: Analyse géospatiale et logiciels
  launcher: Lanceurs
  telecom: Télécoms par satellite
  manufacturing: Constructeurs de satellites
  in_orbit: Services en orbite et exploration
  defense: Défense et systèmes

