# Pays et régions détectés dans les articles.
#
# Un article est rattaché à un pays si l'un de ses termes apparaît (insensible à la casse et aux
# accents, mots entiers, pluriels simples acceptés), ou s'il cite une entité de ce pays.
#   aliases     noms et gentilés en français et en anglais
#   aliases_cs  sigles sensibles à la casse (US, UK, UAE…)
# Mettre entre guillemets les codes que YAML lirait comme un booléen ("NO" pour la Norvège).

regions:
  europe: Europe
  north_america: Amérique du Nord
  latin_america: Amérique latine
  asia_pacific: Asie-Pacifique
  middle_east: Moyen-Orient
  africa: Afrique
  russia_eurasia: Russie et Eurasie
  international: International

countries:
  # ------------------------------------------------------------ Europe
  FR: {name: France, region: europe, aliases: [France, French, français, française]}
  DE: {name: Allemagne, region: europe, aliases: [Germany, German, Allemagne, allemand, allemande]}
  IT: {name: Italie, region: europe, aliases: [Italy, Italian, Italie, italien, italienne]}
  ES: {name: Espagne, region: europe, aliases: [Spain, Spanish, Espagne, espagnol, espagnole]}
  GB: {name: Royaume-Uni, region: europe, aliases: [United Kingdom, Britain, British, Royaume-Uni, britannique], aliases_cs: [UK]}
  BE: {name: Belgique, region: europe, aliases: [Belgium, Belgian, Belgique, belge]}
  NL: {name: Pays-Bas, region: europe, aliases: [Netherlands, Dutch, Pays-Bas, néerlandais, néerlandaise]}
  LU: {name: Luxembourg, region: europe, aliases: [Luxembourg, luxembourgeois, luxembourgeoise]}
  PT: {name: Portugal, region: europe, aliases: [Portugal, Portuguese, portugais, portugaise]}
  SE: {name: Suède, region: europe, aliases: [Sweden, Swedish, Suède, suédois, suédoise]}
  "NO": {name: Norvège, region: europe, aliases: [Norway, Norwegian, Norvège, norvégien, norvégienne]}
  FI: {name: Finlande, region: europe, aliases: [Finland, Finnish, Finlande, finlandais, finlandaise]}
  DK: {name: Danemark, region: europe, aliases: [Denmark, Danish, Danemark, danois, danoise]}
  PL: {name: Pologne, region: europe, aliases: [Poland, Polish, Pologne, polonais, polonaise]}
  CZ: {name: Tchéquie, region: europe, aliases: [Czech Republic, Czechia, Czech, Tchéquie, République tchèque, tchèque]}
  AT: {name: Autriche, region: europe, aliases: [Austria, Austrian, Autriche, autrichien, autrichienne]}
  CH: {name: Suisse, region: europe, aliases: [Switzerland, Swiss, Suisse]}
  GR: {name: Grèce, region: europe, aliases: [Greece, Greek, Grèce]}
  RO: {name: Roumanie, region: europe, aliases: [Romania, Romanian, Roumanie, roumain, roumaine]}
  HU: {name: Hongrie, region: europe, aliases: [Hungary, Hungarian, Hongrie, hongrois, hongroise]}
  IE: {name: Irlande, region: europe, aliases: [Ireland, Irish, Irlande, irlandais, irlandaise]}
  EE: {name: Estonie, region: europe, aliases: [Estonia, Estonian, Estonie]}
  LT: {name: Lituanie, region: europe, aliases: [Lithuania, Lithuanian, Lituanie]}
  LV: {name: Lettonie, region: europe, aliases: [Latvia, Latvian, Lettonie]}
  UA: {name: Ukraine, region: europe, aliases: [Ukraine, Ukrainian, ukrainien, ukrainienne]}

  # ------------------------------------------------------------ Amérique du Nord
  US: {name: États-Unis, region: north_america, aliases: [United States, USA, American, États-Unis, américain, américaine, Pentagon, Pentagone], aliases_cs: [US, U.S.]}
  CA: {name: Canada, region: north_america, aliases: [Canada, Canadian, canadien, canadienne]}
